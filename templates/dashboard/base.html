  <script>
        document.querySelectorAll(".edit-btn").forEach(btn => {
            btn.addEventListener("click", function() {

                document.getElementById("edit-id").value =
                    this.dataset.id;

                document.getElementById("edit-name").value =
                    this.dataset.name;

                document.getElementById("edit-title").value =
                    this.dataset.title;
                // document.getElementById("edit-image").value =
                //     this.dataset.image;
                // document.getElementById("edit-image").src =
                //     this.dataset.image;

                const imagePreview = document.getElementById("edit-image");

                if (imagePreview) {
                    imagePreview.src = this.dataset.image || "";
                    imagePreview.style.display = this.dataset.image ? "block" : "none";
                }
                document.getElementById("edit-rating").value =
                    this.dataset.rating;

                document.getElementById("edit-company").value =
                    this.dataset.company;

                document.getElementById("edit-message").value =
                    this.dataset.content;

                new bootstrap.Modal(
                    document.getElementById("editModal")
                ).show();
            });
        });

        document.querySelectorAll(".delete-btn").forEach(btn => {
            btn.addEventListener("click", function() {

                document.getElementById("delete-id").value =
                    this.dataset.id;

                new bootstrap.Modal(
                    document.getElementById("deleteModal")
                ).show();
            });
        });
    </script>
  <script>
        document.querySelectorAll(".editfaq-btn").forEach(btn => {
            btn.addEventListener("click", function() {

                document.getElementById("edit-id").value =
                    this.dataset.id;

                document.getElementById("edit-question").value =
                    this.dataset.question;

                document.getElementById("edit-answer").value =
                    this.dataset.answer;
                
                document.getElementById("edit-is-active").checked =
                    this.dataset.is_active === "True";
                

                new bootstrap.Modal(
                    document.getElementById("editfaqModal")
                ).show();
            });
        });

        document.querySelectorAll(".deletefaq-btn").forEach(btn => {
            btn.addEventListener("click", function() {

                document.getElementById("delete-id").value =
                    this.dataset.id;

                new bootstrap.Modal(
                    document.getElementById("deletefaqModal")
                ).show();
            });
        });
    </script>
  <script>
        document.querySelectorAll(".editfeature-btn").forEach(btn => {
            btn.addEventListener("click", function() {

                document.getElementById("edit-id").value =
                    this.dataset.id;

                document.getElementById("edit-title").value =
                    this.dataset.title;

                document.getElementById("edit-description").value =
                    this.dataset.description;
                
                document.getElementById("edit-is-active").checked =
                    this.dataset.is_active === "True";
                

                const imagePreview = document.getElementById("editfeature-image");

                if (imagePreview) {
                    imagePreview.src = this.dataset.image || "";
                    imagePreview.style.display = this.dataset.image ? "block" : "none";
                }

                new bootstrap.Modal(
                    document.getElementById("editfeatureModal")
                ).show();
            });
        });

        document.querySelectorAll(".deletefeature-btn").forEach(btn => {
            btn.addEventListener("click", function() {

                document.getElementById("delete-id").value =
                    this.dataset.id;

                new bootstrap.Modal(
                    document.getElementById("deletefaqModal")
                ).show();
            });
        });
    </script>

                document.getElementById("edit-content").value =

  <script>
        document.querySelectorAll(".editblog-btn").forEach(btn => {
            btn.addEventListener("click", function() {

                document.getElementById("edit-id").value =
                    this.dataset.id;

                document.getElementById("edit-title").value =
                    this.dataset.title;

                document.getElementById("edit-author").value =
                    this.dataset.author;
                // document.getElementById("edit-image").value =
                //     this.dataset.image;
                // document.getElementById("edit-image").src =
                //     this.dataset.image;

                const imagePreview = document.getElementById("editblog-image");

                if (imagePreview) {
                    imagePreview.src = this.dataset.image || "";
                    imagePreview.style.display = this.dataset.image ? "block" : "none";
                }
                document.getElementById("edit-content").value =
                    this.dataset.content;

                document.getElementById("edit-category").value =
                    this.dataset.category;

                document.getElementById("edit-slug").value =
                    this.dataset.slug;
                
                // document.getElementById("edit-is-published").checked =
                //     this.dataset.is_published === "True";

                document.getElementById("edit-is-published").checked =
                    this.dataset.is_published === "True" || this.dataset.is_published === "true";

                new bootstrap.Modal(
                    document.getElementById("editblogModal")
                ).show();
            });
        });

        document.querySelectorAll(".delete-btn").forEach(btn => {
            btn.addEventListener("click", function() {

                document.getElementById("delete-id").value =
                    this.dataset.id;

                new bootstrap.Modal(
                    document.getElementById("deleteblogModal")
                ).show();
            });
        });
    </script>
